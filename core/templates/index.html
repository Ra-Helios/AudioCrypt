<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AudioCrypt</title>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Syne:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg:        #0a0c10;
    --surface:   #111318;
    --card:      #161a22;
    --border:    #1f2533;
    --accent:    #00e5ff;
    --accent2:   #7b61ff;
    --success:   #00e676;
    --danger:    #ff1744;
    --warn:      #ffd740;
    --text:      #e2e8f0;
    --muted:     #5a6a82;
    --mono:      'Share Tech Mono', monospace;
    --sans:      'Syne', sans-serif;
  }

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--sans);
    min-height: 100vh;
    overflow-x: hidden;
  }

  /* ── Background grid ── */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,229,255,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,229,255,0.03) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* ── Glow orbs ── */
  .orb {
    position: fixed;
    border-radius: 50%;
    filter: blur(120px);
    pointer-events: none;
    z-index: 0;
    opacity: 0.18;
  }
  .orb-1 { width: 500px; height: 500px; background: var(--accent2); top: -150px; left: -150px; }
  .orb-2 { width: 400px; height: 400px; background: var(--accent); bottom: -100px; right: -100px; }

  /* ── Layout ── */
  .wrapper {
    position: relative;
    z-index: 1;
    max-width: 820px;
    margin: 0 auto;
    padding: 40px 24px 80px;
  }

  /* ── Header ── */
  header {
    text-align: center;
    margin-bottom: 48px;
    animation: fadeDown 0.6s ease both;
  }

  .logo-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 14px;
    margin-bottom: 8px;
  }

  .logo-icon {
    width: 44px;
    height: 44px;
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    border-radius: 12px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 22px;
    box-shadow: 0 0 24px rgba(0,229,255,0.3);
  }

  h1 {
    font-size: 2.4rem;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .tagline {
    font-family: var(--mono);
    color: var(--muted);
    font-size: 0.82rem;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  /* ── Card ── */
  .card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 32px;
    margin-bottom: 20px;
    animation: fadeUp 0.5s ease both;
    box-shadow: 0 8px 40px rgba(0,0,0,0.4);
  }

  /* ── Mode tabs ── */
  .tabs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 8px;
    margin-bottom: 28px;
    background: var(--surface);
    border-radius: 12px;
    padding: 6px;
    border: 1px solid var(--border);
  }

  .tab {
    padding: 11px;
    border-radius: 8px;
    text-align: center;
    cursor: pointer;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.88rem;
    letter-spacing: 0.5px;
    color: var(--muted);
    transition: all 0.25s ease;
    border: none;
    background: transparent;
  }

  .tab.active {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    box-shadow: 0 2px 16px rgba(0,229,255,0.2);
  }

  /* ── Section label ── */
  .section-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 10px;
  }

  /* ── PIN ── */
  .pin-wrap {
    display: flex;
    gap: 14px;
    align-items: center;
    margin-bottom: 28px;
  }

  .pin-label {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 2px;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .pin-inputs {
    display: flex;
    gap: 10px;
  }

  .pin-inputs input {
    width: 56px;
    height: 56px;
    text-align: center;
    font-family: var(--mono);
    font-size: 1.5rem;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    color: var(--accent);
    outline: none;
    transition: border-color 0.2s, box-shadow 0.2s;
    caret-color: var(--accent);
  }

  .pin-inputs input:focus {
    border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(0,229,255,0.12);
  }

  .pin-inputs input.filled {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(123,97,255,0.12);
  }

  /* ── Batch toggle ── */
  .batch-row {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 24px;
  }

  .batch-row span {
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .toggle-switch {
    position: relative;
    width: 48px;
    height: 26px;
    flex-shrink: 0;
  }

  .toggle-switch input { display: none; }

  .toggle-slider {
    position: absolute;
    inset: 0;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 99px;
    cursor: pointer;
    transition: 0.25s;
  }

  .toggle-slider::after {
    content: '';
    position: absolute;
    left: 3px;
    top: 3px;
    width: 18px;
    height: 18px;
    border-radius: 50%;
    background: var(--muted);
    transition: 0.25s;
  }

  .toggle-switch input:checked + .toggle-slider {
    background: linear-gradient(90deg, var(--accent2), var(--accent));
    border-color: transparent;
  }

  .toggle-switch input:checked + .toggle-slider::after {
    left: calc(100% - 21px);
    background: #fff;
  }

  /* ── Drop zone ── */
  .drop-zone {
    border: 2px dashed var(--border);
    border-radius: 14px;
    padding: 48px 24px;
    text-align: center;
    cursor: pointer;
    transition: all 0.25s ease;
    background: var(--surface);
    margin-bottom: 20px;
    min-height: 140px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
  }

  .drop-zone:hover, .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(0,229,255,0.04);
    box-shadow: inset 0 0 30px rgba(0,229,255,0.05);
  }

  .drop-icon { font-size: 2.2rem; }

  .drop-main {
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--text);
  }

  .drop-sub {
    font-family: var(--mono);
    font-size: 0.72rem;
    color: var(--muted);
    letter-spacing: 1px;
  }

  .file-list {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-height: 120px;
    overflow-y: auto;
  }

  .file-chip {
    display: flex;
    align-items: center;
    gap: 8px;
    background: rgba(0,229,255,0.06);
    border: 1px solid rgba(0,229,255,0.15);
    border-radius: 8px;
    padding: 6px 12px;
    font-family: var(--mono);
    font-size: 0.78rem;
    color: var(--accent);
  }

  /* ── Path input ── */
  .path-row {
    display: flex;
    gap: 10px;
    margin-bottom: 24px;
  }

  .path-input {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px 16px;
    font-family: var(--mono);
    font-size: 0.82rem;
    color: var(--text);
    outline: none;
    transition: border-color 0.2s;
  }

  .path-input:focus {
    border-color: var(--accent2);
    box-shadow: 0 0 0 3px rgba(123,97,255,0.1);
  }

  .path-input::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 12px 22px;
    border-radius: 10px;
    font-family: var(--sans);
    font-weight: 600;
    font-size: 0.88rem;
    letter-spacing: 0.4px;
    border: none;
    cursor: pointer;
    transition: all 0.2s ease;
    white-space: nowrap;
  }

  .btn-primary {
    background: linear-gradient(135deg, var(--accent2), var(--accent));
    color: #fff;
    width: 100%;
    padding: 14px;
    font-size: 0.95rem;
    letter-spacing: 1px;
    text-transform: uppercase;
    box-shadow: 0 4px 20px rgba(0,229,255,0.2);
  }

  .btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 8px 28px rgba(0,229,255,0.3);
  }

  .btn-primary:active { transform: translateY(0); }

  .btn-primary:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }

  .btn-ghost {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    flex-shrink: 0;
  }

  .btn-ghost:hover {
    border-color: var(--accent2);
    color: var(--accent2);
  }

  .btn-reset {
    background: transparent;
    border: 1px solid rgba(255,23,68,0.3);
    color: var(--danger);
    margin-top: 10px;
    width: 100%;
  }

  .btn-reset:hover {
    background: rgba(255,23,68,0.08);
    border-color: var(--danger);
  }

  /* ── Terminal ── */
  .terminal-card {
    background: #080b0f;
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    animation: fadeUp 0.5s 0.1s ease both;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
  }

  .terminal-header {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 12px 18px;
    background: #0d1017;
    border-bottom: 1px solid var(--border);
  }

  .term-dot {
    width: 12px;
    height: 12px;
    border-radius: 50%;
  }
  .term-dot.r { background: #ff5f57; }
  .term-dot.y { background: #ffbd2e; }
  .term-dot.g { background: #28ca41; }

  .term-title {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--muted);
    letter-spacing: 1px;
    margin-left: 6px;
  }

  .term-status {
    margin-left: auto;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    background: var(--muted);
    transition: background 0.3s;
  }

  .term-status.active { background: var(--success); box-shadow: 0 0 6px var(--success); }

  .terminal-body {
    font-family: var(--mono);
    font-size: 0.8rem;
    line-height: 1.8;
    padding: 18px 20px;
    height: 260px;
    overflow-y: auto;
    color: #7a8fa6;
  }

  .terminal-body::-webkit-scrollbar { width: 4px; }
  .terminal-body::-webkit-scrollbar-track { background: transparent; }
  .terminal-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 99px; }

  .log-line { display: flex; gap: 8px; align-items: flex-start; }
  .log-line.info  .log-icon { color: var(--accent); }
  .log-line.ok    .log-icon { color: var(--success); }
  .log-line.error .log-icon { color: var(--danger); }
  .log-line.warn  .log-icon { color: var(--warn); }

  .log-line.ok   .log-text { color: var(--success); }
  .log-line.error .log-text { color: var(--danger); }
  .log-line.warn  .log-text { color: var(--warn); }
  .log-line.info  .log-text { color: #7a8fa6; }

  .log-icon { flex-shrink: 0; width: 16px; }

  .cursor {
    display: inline-block;
    width: 8px;
    height: 14px;
    background: var(--accent);
    animation: blink 1s step-end infinite;
    vertical-align: text-bottom;
    margin-left: 2px;
    border-radius: 2px;
  }

  /* ── Download area ── */
  .downloads {
    margin-top: 16px;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .download-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(0,230,118,0.06);
    border: 1px solid rgba(0,230,118,0.2);
    border-radius: 10px;
    padding: 10px 16px;
  }

  .download-name {
    font-family: var(--mono);
    font-size: 0.8rem;
    color: var(--success);
  }

  .download-btn {
    font-family: var(--mono);
    font-size: 0.75rem;
    color: var(--success);
    background: rgba(0,230,118,0.1);
    border: 1px solid rgba(0,230,118,0.3);
    border-radius: 6px;
    padding: 5px 12px;
    cursor: pointer;
    text-decoration: none;
    transition: all 0.2s;
  }

  .download-btn:hover {
    background: rgba(0,230,118,0.2);
  }

  /* ── Toast ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(80px);
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 24px;
    font-family: var(--mono);
    font-size: 0.83rem;
    box-shadow: 0 8px 40px rgba(0,0,0,0.5);
    z-index: 100;
    transition: transform 0.3s cubic-bezier(0.34,1.56,0.64,1), opacity 0.3s;
    opacity: 0;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }
  .toast.success { border-color: rgba(0,230,118,0.4); }
  .toast.error   { border-color: rgba(255,23,68,0.4); }

  /* ── Spinner ── */
  .spinner {
    width: 18px;
    height: 18px;
    border: 2px solid rgba(255,255,255,0.2);
    border-top-color: #fff;
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    display: none;
  }

  .btn-primary.loading .spinner { display: block; }
  .btn-primary.loading .btn-text { opacity: 0.7; }

  /* ── Divider ── */
  .divider {
    height: 1px;
    background: var(--border);
    margin: 24px 0;
  }

  /* ── Animations ── */
  @keyframes fadeDown {
    from { opacity: 0; transform: translateY(-20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(20px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes blink {
    0%, 100% { opacity: 1; }
    50%       { opacity: 0; }
  }

  @keyframes spin {
    to { transform: rotate(360deg); }
  }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .log-line { animation: slideIn 0.2s ease both; }

  /* ── Responsive ── */
  @media (max-width: 560px) {
    h1 { font-size: 1.8rem; }
    .card { padding: 20px; }
    .pin-wrap { flex-wrap: wrap; }
  }
</style>
</head>
<body>

<div class="orb orb-1"></div>
<div class="orb orb-2"></div>

<div class="wrapper">

  <!-- Header -->
  <header>
    <div class="logo-line">
      <div class="logo-icon">🔐</div>
      <h1>AudioCrypt</h1>
    </div>
    <p class="tagline">Image ⇄ Audio · Encrypted · Steganography</p>
  </header>

  <!-- Main card -->
  <div class="card">

    <!-- Tabs -->
    <div class="tabs">
      <button class="tab active" id="encodeTab" onclick="setMode('encode')">⬆ Encode Image → Audio</button>
      <button class="tab" id="decodeTab" onclick="setMode('decode')">⬇ Decode Audio → Image</button>
    </div>

    <!-- PIN -->
    <div class="pin-wrap">
      <span class="pin-label">3-Digit Key</span>
      <div class="pin-inputs" id="pinInputs">
        <input type="password" inputmode="numeric" maxlength="1" pattern="\d">
        <input type="password" inputmode="numeric" maxlength="1" pattern="\d">
        <input type="password" inputmode="numeric" maxlength="1" pattern="\d">
      </div>
    </div>

    <!-- Batch toggle -->
    <div class="batch-row">
      <span>SINGLE</span>
      <label class="toggle-switch">
        <input type="checkbox" id="batchToggle">
        <span class="toggle-slider"></span>
      </label>
      <span>BATCH</span>
      <span style="margin-left:auto; font-size:0.72rem; color:var(--muted);" id="batchHint">
        Single file mode
      </span>
    </div>

    <!-- Drop zone -->
    <div class="section-label" id="dropLabel">Input File</div>
    <div class="drop-zone" id="dropZone">
      <div class="drop-icon">📂</div>
      <div class="drop-main">Drag &amp; Drop or Click to Browse</div>
      <div class="drop-sub" id="dropSub">Accepts .png · .jpg · .jpeg</div>
    </div>

    <!-- Output path -->
    <div class="section-label">Output Folder Path (optional)</div>
    <div class="path-row">
      <input type="text" class="path-input" id="outputPath" placeholder="e.g.  /home/user/output  or  C:\Users\output">
    </div>

    <div class="divider"></div>

    <!-- Action button -->
    <button class="btn btn-primary" id="actionBtn" onclick="runAction()">
      <span class="spinner" id="spinner"></span>
      <span class="btn-text" id="btnText">🔒 Encrypt &amp; Save</span>
    </button>

    <button class="btn btn-reset" onclick="resetAll()">↺ Reset</button>

  </div>

  <!-- Terminal -->
  <div class="terminal-card">
    <div class="terminal-header">
      <div class="term-dot r"></div>
      <div class="term-dot y"></div>
      <div class="term-dot g"></div>
      <span class="term-title">audiocrypt — terminal output</span>
      <div class="term-status" id="termStatus"></div>
    </div>
    <div class="terminal-body" id="terminal">
      <div class="log-line info">
        <span class="log-icon">›</span>
        <span class="log-text">AudioCrypt ready. Awaiting operation...<span class="cursor"></span></span>
      </div>
    </div>
  </div>

  <!-- Downloads -->
  <div class="downloads" id="downloads"></div>

</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toastIcon">✓</span>
  <span id="toastMsg"></span>
</div>

<script>
  let currentMode = 'encode';
  let selectedFiles = [];

  // ── MODE ──
  function setMode(mode) {
    currentMode = mode;
    document.getElementById('encodeTab').classList.toggle('active', mode === 'encode');
    document.getElementById('decodeTab').classList.toggle('active', mode === 'decode');
    const isEncode = mode === 'encode';
    document.getElementById('dropSub').textContent = isEncode ? 'Accepts .png · .jpg · .jpeg' : 'Accepts .wav';
    document.getElementById('btnText').textContent = isEncode ? '🔒 Encrypt & Save' : '🔓 Decrypt & Save';
    document.getElementById('dropLabel').textContent = isEncode ? 'Input Image File(s)' : 'Input Audio File(s)';
    selectedFiles = [];
    renderDropZone();
    updateBatchHint();
  }

  // ── BATCH TOGGLE ──
  document.getElementById('batchToggle').addEventListener('change', () => {
    selectedFiles = [];
    renderDropZone();
    updateBatchHint();
  });

  function isBatch() {
    return document.getElementById('batchToggle').checked;
  }

  function updateBatchHint() {
    const hint = document.getElementById('batchHint');
    if (isBatch()) {
      hint.textContent = currentMode === 'encode'
        ? 'Batch: all .png/.jpg in folder'
        : 'Batch: all .wav in folder';
    } else {
      hint.textContent = 'Single file mode';
    }
  }

  // ── DROP ZONE ──
  const dropZone = document.getElementById('dropZone');

  dropZone.addEventListener('dragover', e => { e.preventDefault(); dropZone.classList.add('drag-over'); });
  dropZone.addEventListener('dragleave', () => dropZone.classList.remove('drag-over'));
  dropZone.addEventListener('drop', async e => {
    e.preventDefault();
    dropZone.classList.remove('drag-over');
    const items = e.dataTransfer.items;
    let files = [];

    async function traverse(entry) {
      return new Promise(resolve => {
        if (entry.isFile) {
          entry.file(f => { files.push(f); resolve(); });
        } else if (entry.isDirectory) {
          const reader = entry.createReader();
          reader.readEntries(async entries => {
            for (const en of entries) await traverse(en);
            resolve();
          });
        }
      });
    }

    const promises = [];
    for (let i = 0; i < items.length; i++) {
      const entry = items[i].webkitGetAsEntry();
      if (entry) promises.push(traverse(entry));
    }
    await Promise.all(promises);
    handleFiles(files);
  });

  dropZone.addEventListener('click', () => {
    const input = document.createElement('input');
    input.type = 'file';
    if (isBatch()) { input.multiple = true; }
    input.onchange = e => handleFiles([...e.target.files]);
    input.click();
  });

  function handleFiles(files) {
    const exts = currentMode === 'encode'
      ? ['.png', '.jpg', '.jpeg']
      : ['.wav'];

    const valid = files.filter(f => exts.some(e => f.name.toLowerCase().endsWith(e)));

    if (valid.length === 0) {
      showToast(`No valid files. Expected: ${exts.join(', ')}`, 'error');
      return;
    }

    if (!isBatch()) {
      selectedFiles = [valid[0]];
    } else {
      selectedFiles = valid;
    }

    renderDropZone();
  }

  function renderDropZone() {
    if (selectedFiles.length === 0) {
      const isEncode = currentMode === 'encode';
      dropZone.innerHTML = `
        <div class="drop-icon">📂</div>
        <div class="drop-main">Drag &amp; Drop or Click to Browse</div>
        <div class="drop-sub" id="dropSub">${isEncode ? 'Accepts .png · .jpg · .jpeg' : 'Accepts .wav'}</div>`;
      return;
    }
    dropZone.innerHTML = `<div class="file-list">${
      selectedFiles.map(f => `<div class="file-chip">📄 ${f.name} <span style="color:var(--muted);margin-left:auto">${formatSize(f.size)}</span></div>`).join('')
    }</div>`;
  }

  function formatSize(bytes) {
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / (1024 * 1024)).toFixed(2) + ' MB';
  }

  // ── PIN ──
  const pinInputs = document.querySelectorAll('.pin-inputs input');
  pinInputs.forEach((inp, i) => {
    inp.addEventListener('input', () => {
      inp.value = inp.value.replace(/\D/g, '').slice(0, 1);
      inp.classList.toggle('filled', !!inp.value);
      if (inp.value && i < 2) pinInputs[i + 1].focus();
    });
    inp.addEventListener('keydown', e => {
      if (e.key === 'Backspace' && !inp.value && i > 0) pinInputs[i - 1].focus();
    });
  });

  function getKey() {
    return [...pinInputs].map(i => i.value).join('');
  }

  // ── TERMINAL ──
  const terminal = document.getElementById('terminal');

  function clearTerminal() {
    terminal.innerHTML = '';
  }

  function logLine(text, type = 'info') {
    const icons = { info: '›', ok: '✔', error: '✘', warn: '⚠' };
    const div = document.createElement('div');
    div.className = `log-line ${type}`;
    div.innerHTML = `<span class="log-icon">${icons[type]}</span><span class="log-text">${escHtml(text)}</span>`;
    terminal.appendChild(div);
    terminal.scrollTop = terminal.scrollHeight;
  }

  function escHtml(str) {
    return str.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function setTermActive(active) {
    document.getElementById('termStatus').className = 'term-status' + (active ? ' active' : '');
  }

  function renderLogs(logs) {
    logs.forEach(line => {
      if (line.startsWith('  ✔')) logLine(line.trim(), 'ok');
      else if (line.startsWith('  ✘') || line.includes('Error') || line.includes('mismatch') || line.includes('No encrypted')) logLine(line.trim(), 'error');
      else if (line.startsWith('⚠')) logLine(line.trim(), 'warn');
      else logLine(line, 'info');
    });
  }

  // ── DOWNLOADS ──
  function renderDownloads(downloads) {
    const container = document.getElementById('downloads');
    container.innerHTML = '';
    downloads.forEach(dl => {
      const item = document.createElement('div');
      item.className = 'download-item';
      item.innerHTML = `
        <span class="download-name">📦 ${escHtml(dl.filename)}</span>
        <a class="download-btn" href="/download/${dl.token}/${encodeURIComponent(dl.filename)}" download="${escHtml(dl.filename)}">⬇ Download</a>`;
      container.appendChild(item);
    });
  }

  // ── RUN ACTION ──
  async function runAction() {
    const key = getKey();
    if (key.length !== 3) { showToast('Enter all 3 key digits', 'error'); return; }
    if (selectedFiles.length === 0) { showToast('No files selected', 'error'); return; }

    const btn = document.getElementById('actionBtn');
    btn.classList.add('loading');
    btn.disabled = true;
    setTermActive(true);
    clearTerminal();
    document.getElementById('downloads').innerHTML = '';

    const endpoint = currentMode === 'encode' ? '/encode' : '/decode';
    const formData = new FormData();
    selectedFiles.forEach(f => formData.append('files', f));
    formData.append('key', key);
    formData.append('output', document.getElementById('outputPath').value.trim());
    formData.append('batch', isBatch() ? 'true' : 'false');

    logLine(`Mode: ${currentMode.toUpperCase()} | Files: ${selectedFiles.length} | Batch: ${isBatch()}`, 'info');
    logLine('─'.repeat(48), 'info');

    try {
      const res = await fetch(endpoint, { method: 'POST', body: formData });
      const data = await res.json();

      renderLogs(data.logs || []);

      logLine('─'.repeat(48), 'info');
      if (data.success) {
        logLine('Operation completed successfully.', 'ok');
        showToast(data.message, 'success');
        renderDownloads(data.downloads || []);
      } else {
        logLine(data.message || 'Operation failed.', 'error');
        showToast(data.message || 'Operation failed.', 'error');
      }
    } catch (err) {
      logLine('Network error: ' + err.message, 'error');
      showToast('Network error', 'error');
    }

    btn.classList.remove('loading');
    btn.disabled = false;
    setTermActive(false);
  }

  // ── RESET ──
  function resetAll() {
    selectedFiles = [];
    renderDropZone();
    pinInputs.forEach(i => { i.value = ''; i.classList.remove('filled'); });
    document.getElementById('outputPath').value = '';
    document.getElementById('batchToggle').checked = false;
    document.getElementById('downloads').innerHTML = '';
    updateBatchHint();
    clearTerminal();
    logLine('AudioCrypt ready. Awaiting operation...', 'info');
    setTermActive(false);
  }

  // ── TOAST ──
  function showToast(msg, type = 'success') {
    const toast = document.getElementById('toast');
    document.getElementById('toastMsg').textContent = msg;
    document.getElementById('toastIcon').textContent = type === 'success' ? '✓' : '✕';
    toast.className = `toast ${type} show`;
    setTimeout(() => { toast.classList.remove('show'); }, 3500);
  }
</script>
</body>
</html>
